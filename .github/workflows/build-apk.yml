name: Build waiter APK

# No local/VPS machine in this project has a Java + Android SDK toolchain --
# building the APK by hand is a whole separate install nobody wants to
# maintain just for this one app. This runs the same steps (npm build ->
# cap sync -> gradlew assembleDebug) on GitHub's own runner instead, so a
# fresh installable APK is one push (or one manual "Run workflow" click)
# away, downloadable from this run's own Summary page.
#
# Ships a DEBUG apk on purpose, not a signed release build -- same
# hand-distributed sideload model as AlFahad_DriverApp's own APK (see that
# repo's .gitignore comment). A signed release keystore can be added later
# (GitHub Secrets + a release build step) if this ever needs a Play Store
# listing; nothing here blocks that.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      # sourceCompatibility/targetCompatibility in android/app/capacitor.build.gradle
      # (generated by cap sync) is VERSION_21 -- must match or Gradle fails
      # immediately on a version-mismatch error, not a vague one.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # compileSdk/targetSdk are 36 (android/variables.gradle) -- ubuntu-latest's
      # preinstalled Android SDK doesn't necessarily have that platform yet,
      # so it's installed explicitly rather than hoping Gradle's own
      # auto-download (which can hang on an interactive license prompt in CI)
      # picks it up.
      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: waiter-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
