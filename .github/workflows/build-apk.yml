name: Build waiter APK

# No local/VPS machine in this project has a Java + Android SDK toolchain --
# building the APK by hand is a whole separate install nobody wants to
# maintain just for this one app. This runs the same steps (npm build ->
# cap sync -> gradlew assembleDebug) on GitHub's own runner instead, so a
# fresh installable APK is one push (or one manual "Run workflow" click)
# away, downloadable from this run's own Summary page.
#
# Ships a DEBUG apk on purpose, not a signed release build -- same
# hand-distributed sideload model as AlFahad_DriverApp's own APK (see that
# repo's .gitignore comment). A signed release keystore can be added later
# (GitHub Secrets + a release build step) if this ever needs a Play Store
# listing; nothing here blocks that.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      # sourceCompatibility/targetCompatibility in android/app/capacitor.build.gradle
      # (generated by cap sync) is VERSION_21 -- must match or Gradle fails
      # immediately on a version-mismatch error, not a vague one.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # compileSdk/targetSdk are 36 (android/variables.gradle) -- ubuntu-latest's
      # preinstalled Android SDK doesn't necessarily have that platform yet,
      # so it's installed explicitly rather than hoping Gradle's own
      # auto-download (which can hang on an interactive license prompt in CI)
      # picks it up.
      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - run: npx cap sync android

      # AGP's default debug signingConfig looks for exactly this file/alias/
      # password and auto-generates it on a normal dev machine the first
      # time a debug build runs -- but on this fresh, throwaway CI runner
      # that auto-generation didn't happen (still unclear why; possibly a
      # Gradle/AGP 8.13 + JDK 21 combination quirk), and the build quietly
      # produced a completely UNSIGNED app-debug.apk instead of failing
      # loudly. Android refuses to install an unsigned APK -- Chrome's own
      # download UI gives no error for this, it just never launches the
      # installer, which is exactly the "finishes downloading, nothing
      # happens" report this fixes. Generating it explicitly with the
      # well-known Android debug keystore defaults removes the guesswork.
      - name: Ensure Android debug keystore exists
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}

      - name: Build debug APK
        working-directory: android
        run: |
          # gradlew's executable bit doesn't survive a commit made from
          # Windows (this repo's whole history was authored on a Windows
          # PC with no WSL/git-bash chmod step) -- restore it here rather
          # than depend on the bit having been set correctly at commit time.
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      # Catches exactly the failure mode that shipped twice already: a build
      # that "succeeds" but produces an unsigned APK Android silently
      # refuses to install. Plain `jarsigner -verify` is NOT enough on its
      # own -- on a genuinely unsigned jar it just prints "jar is unsigned"
      # and still exits 0, which is exactly how the first fix attempt here
      # sailed through CI green while shipping a still-broken APK. Grep its
      # own output for that phrase (and fail on it) instead of trusting the
      # exit code.
      - name: Verify the APK is actually signed
        run: |
          out=$(jarsigner -verify android/app/build/outputs/apk/debug/app-debug.apk 2>&1)
          echo "$out"
          if echo "$out" | grep -q "jar is unsigned"; then
            echo "::error::app-debug.apk is UNSIGNED -- Android will silently refuse to install it."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: waiter-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
